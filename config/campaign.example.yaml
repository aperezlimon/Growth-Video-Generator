# Copia como campaign.yaml y rellena
workspace: "ws_001"           # tenant: tú eres el primer cliente
campaign:
  name: "Q1 – Autoridad en ventas B2B"
  industry: "SaaS B2B"
  topic_pillars: ["productividad comercial", "CRM", "liderazgo de ventas"]
  target_audience:
    role: "Directores comerciales y CEOs de pymes"
    country: "ES"
    language: "es"
    pains: ["el equipo no usa el CRM", "pipeline poco predecible"]
    desires: ["equipo autónomo", "previsiones fiables"]
    objections: ["no tengo tiempo", "ya lo hemos intentado"]
  channels: [tiktok, instagram, youtube, linkedin]   # solo vertical 9:16
  goal:                      # North Star
    metric: followers        # followers | views | engagement_rate | leads
    channel: linkedin
    baseline: 1200
    target: 10000
    deadline: "2027-03-31"
  secondary_goals:
    - { metric: views, channel: instagram, target_monthly: 200000 }
  production:
    ideas_per_week: 3
    versions_per_idea: 10
    max_posts_per_channel_per_day: 2
  budget:
    monthly_eur: 0             # MVP: stack gratuito (ver docs cap. 9)
    max_cost_per_version_eur: 0
  autonomy:                  # manual = requiere tu aprobación
    scripts: manual
    render: auto
    publish: manual          # publicación manual asistida hasta pasar auditorías
